- type: gameMap
  id: Ministation
  mapName: 'Ministation'
  mapPath: /Maps/_Scav/ministation.yml
  minPlayers: 0
  maxPlayers: 7
  stations:
    Ministation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Ministation {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SC'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs: # 15 jobs total w/o latejoins, 19 jobs total w/ latejoins
            #civilian (1+)
            Passenger: [ -1, -1 ] #infinite, not counted
