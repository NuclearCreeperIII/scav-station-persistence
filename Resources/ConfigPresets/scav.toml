[server]
rules_file = "ScavRuleset"
id = "ScavStation14"

[infolinks]
bug_report = "https://github.com/Scav-Station-14/scav-station-persistence/issues"
discord    = "https://discord.gg/ePQ5WHHfUd"
github     = "https://github.com/Scav-Station-14/scav-station-persistence"

[ooc]
enable_during_round = true

[looc]
enabled_dead = true
enabled_crit = true

[ic]
flavor_text = true

[lore]
year_offset = 288

[tips]
enabled = false

[atmos]
